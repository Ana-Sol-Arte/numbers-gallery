<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Breathing Garden — Numbers</title>
    <style>
        :root {
            color-scheme: light dark;
        }
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: Canvas;
            color: CanvasText;
            font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        }
        #ui {
            position: fixed; inset: 0 auto auto 0;
            padding: .75rem 1rem; opacity: .5; user-select: none;
            font-size: 12px; line-height: 1.2;
        }
        #ui:hover { opacity: .9; }
        .btn {
            cursor: pointer; border: 1px solid currentColor; border-radius: 999px;
            padding: .25rem .6rem; margin-right: .5rem; background: transparent;
        }
    </style>
</head>
<body>
    <div id="ui">
        <button id="toggleAudio" class="btn">► sound</button>
        <span id="label"></span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="./sketch.js"></script>
</body>
</html>
